<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOCKER-COMPOSE:RESTART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script>
        function sendDockerCommand(endpoint) {
            const logArea = document.getElementById("logArea");
            logArea.innerHTML = `🚀 Executing ${endpoint}...\n`;

            const eventSource = new EventSource(`/${endpoint}`);

            eventSource.onmessage = function(event) {
                logArea.innerHTML += event.data + "\n\n";
                logArea.scrollTop = logArea.scrollHeight;
            };

            eventSource.onerror = function() {
                logArea.innerHTML += "\n❌ Connection closed.";
                eventSource.close();
            };
        }
    </script>
</head>
<body>
<button onclick="sendDockerCommand('restart-docker')">Restart Docker</button>
<button onclick="sendDockerCommand('docker-down')">Docker Down</button>
<button onclick="sendDockerCommand('docker-up')">Docker Up</button>
<pre id="logArea" style="width: 100%; height: 400px; overflow-y: scroll; background: #2e2e2e; color: #dcdcdc; padding: 10px;"></pre>
</body>
</html>
