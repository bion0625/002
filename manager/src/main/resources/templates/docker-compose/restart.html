<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOCKER-COMPOSE:RESTART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <script>
        function restartDocker() {
            const logArea = document.getElementById("logArea");
            logArea.innerHTML = "🚀 Restarting Docker Compose...\n";

            const eventSource = new EventSource("/restart-docker");

            eventSource.onmessage = function(event) {
                logArea.innerHTML += event.data + "\n\n";  // 10줄씩 추가
                logArea.scrollTop = logArea.scrollHeight;  // 자동 스크롤
            };

            eventSource.onerror = function() {
                logArea.innerHTML += "\n❌ Connection closed.";
                eventSource.close();
            };
        }
    </script>
</head>
<body>
    <button onclick="restartDocker()">Intranet Restart</button>
    <pre id="logArea" style="width: 100%; height: 400px; overflow-y: scroll; background: #2e2e2e; color: #dcdcdc; padding: 10px;"></pre>
</body>
</html>
